<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
  </head>
  <body>
    <h1 class="heding">Heading with class</h1>
    <h1>heading without class</h1>

    <ul>
      <li>joy banla</li>
      <li>sonar bangla</li>
      <li>corrupt bangla</li>
      <li>useless bangla</li>
      <li>boltur bangla</li>
    </ul>

    <button class="btn1">hide</button> <br />
    <button class="btn2">show</button> <br />
    <button class="btn3">toggle</button>

    <script>
      $(document).ready(function () {
        $(".btn1").click(function () {
          $("h1").hide();
        });
        $(".btn2").click(function () {
          $("h1").show();
        });
        $(".btn3").click(function () {
          $("h1").toggle();
        });
      });
    </script>
  </body>
</html>
